<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="glowLineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowLineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0" />
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .float-slow {
      animation: floatSlow 6s ease-in-out infinite alternate;
    }
    .float-fast {
      animation: floatFast 4.5s ease-in-out infinite alternate;
    }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: dash 20s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 6 10;
      animation: dashRev 15s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes dashRev {
      to {
        stroke-dashoffset: 1000;
      }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.75; transform: scale(1.02); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes floatFast {
      0% { transform: translateY(0px); }
      100% { transform: translateY(7px); }
    }
  </style>

  <!-- Deep Tech Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <g class="pulse-circle" style="transform-origin: 200px 100px;">
    <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glowFilter)" />
  </g>
  <g class="pulse-circle" style="transform-origin: 1000px 240px; animation-delay: 1.5s;">
    <circle cx="1000" cy="240" r="160" fill="#a855f7" opacity="0.15" filter="url(#glowFilter)" />
  </g>
  <g class="pulse-circle" style="transform-origin: 600px 320px; animation-delay: 0.8s;">
    <circle cx="600" cy="320" r="120" fill="#ec4899" opacity="0.1" filter="url(#glowFilter)" />
  </g>

  <!-- Animated Data / Circuit Stream Lines (Behind Text & Cards) -->
  <g opacity="0.55">
    <path class="stream-line" d="M-50,80 Q200,40 450,110 T950,80 T1250,120" fill="none" stroke="url(#glowLineGrad1)" stroke-width="2.5" />
    <path class="stream-line-rev" d="M-50,280 Q250,330 550,260 T1050,300 T1250,250" fill="none" stroke="url(#glowLineGrad2)" stroke-width="2" />
    <path class="stream-line" d="M100,380 C300,240 400,320 700,210 C900,130 1100,190 1250,150" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Dynamic Orbiting/Flow Nodes (Subtle Background Tech Elements) -->
  <g class="float-slow">
    <circle cx="180" cy="85" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="1020" cy="95" r="5" fill="#f472b6" filter="url(#softGlow)" />
    <circle cx="1110" cy="265" r="4.5" fill="#a855f7" filter="url(#softGlow)" />
    <circle cx="95" cy="260" r="3.5" fill="#34d399" filter="url(#softGlow)" />
  </g>

  <!-- Foreground Content Area: Perfectly Visible and Unobscured -->

  <!-- Top Pill / Status Tag -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="-118" cy="0" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="4.5" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="125" text-anchor="middle" class="title-text" fill="url(#titleGrad)" filter="url(#softGlow)">
    Workflow Automation Platforms
  </text>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" class="subtitle-text">
    The Definitive Guide to iPaaS, No-Code Workflows &amp; Self-Hosted Integration Engines
  </text>

  <!-- Floating Feature Badges / Cards (Aligned neatly in bottom foreground) -->
  <g transform="translate(135, 205)" class="float-slow">
    <!-- Card 1: Enterprise iPaaS -->
    <g transform="translate(0, 0)">
      <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="32" cy="37" r="15" fill="#0284c7" fill-opacity="0.25" />
      <text x="32" y="42" text-anchor="middle" font-size="16">⚡</text>
      <text x="60" y="32" class="badge-text" fill="#f8fafc">Enterprise iPaaS</text>
      <text x="60" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Scalable Cloud Fabric</text>
    </g>

    <!-- Card 2: AI Agents & Logic -->
    <g transform="translate(240, 0)">
      <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="32" cy="37" r="15" fill="#4f46e5" fill-opacity="0.25" />
      <text x="32" y="42" text-anchor="middle" font-size="16">🤖</text>
      <text x="60" y="32" class="badge-text" fill="#f8fafc">AI Agent Workflows</text>
      <text x="60" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">LLM &amp; Tool Orchestration</text>
    </g>

    <!-- Card 3: No-Code & Low-Code -->
    <g transform="translate(480, 0)">
      <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="32" cy="37" r="15" fill="#9333ea" fill-opacity="0.25" />
      <text x="32" y="42" text-anchor="middle" font-size="16">🔄</text>
      <text x="60" y="32" class="badge-text" fill="#f8fafc">Visual Automations</text>
      <text x="60" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Triggers, Steps &amp; Filters</text>
    </g>

    <!-- Card 4: Open-Source Engines -->
    <g transform="translate(720, 0)">
      <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="32" cy="37" r="15" fill="#059669" fill-opacity="0.25" />
      <text x="32" y="42" text-anchor="middle" font-size="16">📦</text>
      <text x="60" y="32" class="badge-text" fill="#f8fafc">Open-Source Engines</text>
      <text x="60" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Self-Hosted &amp; Private</text>
    </g>
  </g>

  <!-- Bottom Mini Indicator -->
  <g transform="translate(600, 322)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#475569" letter-spacing="0.5">
      REST APIs • WEBHOOKS • EVENT STREAMING • HUMAN-IN-THE-LOOP • SOC-2 COMPLIANT
    </text>
  </g>
</svg>
